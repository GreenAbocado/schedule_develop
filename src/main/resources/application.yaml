spring:
  application:
    name: scheduledevelop
  profiles:
    active: dev
server:
  servlet:
    session:
      timeout: 30m  # 기본 30m이지만 명시를 위해 설정
      cookie: # 쿠키 보안 설정
        http-only: true # JS의 쿠키 접근 차단 (오로지 브라우저가 각 도메인에 맞게 자동으로 쿠키 전송)
        secure: true  # HTTPS만 허용, Local에선 변경
        same-site: lax  # 쿠키 단계에서 CSRF 방지 (쿠키의 도메인과 현재 위치하고 있는 도메인이 일치하는지 비교)
        # lax: 다른 사이트에서의 get 요청에는 쿠키를 실어 보냄. (일반적인 웹 서비스 표준) (?)
---
server:
  servlet:
    session:
      cookie:
        secure: false

spring:
  config:
    activate:
      on-profile: dev

# datasource 설정
# 기본 구현체 HikariCP로 설정
# 설정 기반으로 JDBC 드라이버 찾은 후 DB 세션별 커넥션 받아 관리
# 이후 getConnection()을 통해 상위 기술 (JPA 등)에서 사용
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/schedule_develop
    username: root
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create

logging:
  level:
    root: info
    com.greenabocado.scheduledevelop: debug
    org.hibernate.SQL: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{uuid}] %-5level %logger{20} - %msg%n"

---
운영 환경 프로필 (datasource 및 ddl-auto, 로깅 레벨 등 재설정)